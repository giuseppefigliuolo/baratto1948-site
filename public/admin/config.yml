# Decap CMS — ready, not yet active.
# Local editing (no account needed):  npm run cms  +  npm run dev  → http://localhost:4321/admin/
# Online editing needs a GitHub OAuth proxy (GitHub Pages can't run one): deploy one
# (e.g. decap-proxy on Cloudflare Workers) and set `base_url` below to it. See README.
backend:
  name: github
  repo: giuseppefigliuolo/baratto1948-site
  branch: main
  # base_url: https://<oauth-proxy>  # TODO: set when the OAuth proxy exists
  commit_messages:
    update: 'Contenuti: aggiorna {{collection}} “{{slug}}”'
    uploadMedia: 'Media: carica “{{path}}”'

local_backend: true
locale: it
site_url: https://giuseppefigliuolo.github.io/baratto1948-site/
display_url: https://giuseppefigliuolo.github.io/baratto1948-site/

# Images are optimized at build time (AVIF/WebP, responsive sizes) — upload originals.
media_folder: src/assets/images
public_folder: ../../assets/images

collections:
  - name: pagine
    label: Pagine
    editor: { preview: false }
    files:
      - name: home
        label: Home
        file: src/content/pages/home.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Titolo (max 70), name: title, widget: string }
              - { label: Descrizione (max 170), name: description, widget: text }
              - { label: Immagine social (1200×630), name: ogImage, widget: image }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Occhiello, name: kicker, widget: string }
              - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Sottotitolo, name: tagline, widget: string }
              - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
          - label: Manifesto
            name: manifesto
            widget: object
            fields:
              - { label: Frasi (l'ultima è in oro), name: phrases, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Testo, name: body, widget: text }
              - { label: Testo evidenziato, name: bodyAccent, widget: string }
              - label: Immagini decorative (3)
                name: decor
                widget: list
                field: { label: Immagine, name: img, widget: image }
          - label: Radici & Founder
            name: heritage
            widget: object
            fields:
              - label: Radici
                name: roots
                widget: object
                fields:
                  - { label: Occhiello, name: kicker, widget: string }
                  - { label: Frase d'apertura, name: lead, widget: text, hint: '*parola* = parola chiave, in corsivo oro.' }
                  - { label: Testo, name: body, widget: text }
                  - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
              - label: Founder
                name: founder
                widget: object
                fields:
                  - { label: Occhiello, name: kicker, widget: string }
                  - { label: Frase d'apertura, name: lead, widget: text, hint: '*parola* = parola chiave, in corsivo oro.' }
                  - { label: Testo, name: body, widget: text }
                  - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
          - label: Citazione
            name: quote
            widget: object
            fields:
              - { label: Testo laterale sinistro, name: sideLeft, widget: string }
              - { label: Testo laterale destro, name: sideRight, widget: string }
              - { label: Citazione (a capo = nuova riga), name: text, widget: text }
              - { label: Autore, name: author, widget: string }
              - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
          - label: Esperienza
            name: process
            widget: object
            fields:
              - { label: Frasi d'apertura (l'ultima è in oro), name: phrases, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Occhiello, name: kicker, widget: string }
              - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Introduzione, name: intro, widget: text }
              - label: Fasi (5)
                name: steps
                widget: list
                min: 5
                max: 5
                summary: '{{fields.kicker}}'
                fields:
                  - { label: Nome della fase, name: kicker, widget: string }
                  - { label: Titolo, name: title, widget: string }
                  - { label: Titolo (corsivo), name: titleAccent, widget: string }
                  - { label: Testo, name: body, widget: text }
                  - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
          - label: Dettagli
            name: details
            widget: object
            fields:
              - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Testo, name: body, widget: text }
              - { label: Immagine (loader + fallback senza video), name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
              - { label: Video, name: video, widget: object, collapsed: true, fields: [{ label: 'Percorso (es. /video/dettagli.mp4, 9:16)', name: src, widget: string }] }
              - label: Titolo ai lati del video
                name: split
                widget: list
                hint: 'Due righe: [sinistra, destra]. La seconda riga è in oro. *parola* = corsivo.'
                min: 2
                max: 2
                field: { label: Riga, name: row, widget: list, min: 2, max: 2, field: { label: Lato, name: side, widget: string } }
          - label: Collezione
            name: collection
            widget: object
            fields:
              - { label: Occhiello, name: kicker, widget: string }
              - label: Capitoli (3)
                name: chapters
                widget: list
                min: 3
                max: 3
                summary: '{{fields.title}} {{fields.titleAccent}}'
                fields:
                  - { label: ID ancora, name: id, widget: select, options: [giacca, pantalone, tessuti] }
                  - { label: Occhiello, name: kicker, widget: string }
                  - { label: Titolo, name: title, widget: string }
                  - { label: Titolo (corsivo), name: titleAccent, widget: string }
                  - { label: Testo, name: body, widget: text }
                  - { label: Nota (solo desktop), name: extra, widget: string }
                  - { label: Testo del pulsante, name: cta, widget: string }
                  - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
          - label: Fodere
            name: linings
            widget: object
            fields:
              - { label: Occhiello, name: kicker, widget: string }
              - { label: Frasi (l'ultima è in oro), name: phrases, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Testo, name: body, widget: text }
              - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
              - { label: Titolo personalizzazioni, name: groupsTitle, widget: string }
              - label: Gruppi di personalizzazione
                name: groups
                widget: list
                min: 1
                summary: '{{fields.title}}'
                fields:
                  - { label: Titolo, name: title, widget: string }
                  - { label: Voci, name: items, widget: list, min: 1, field: { label: Voce, name: item, widget: string } }
          - label: Atelier (galleria)
            name: atelier
            widget: object
            fields:
              - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Suggerimento, name: hint, widget: string }
              - label: Immagini
                name: gallery
                widget: list
                min: 3
                summary: '{{fields.alt}}'
                fields:
                  - { label: Immagine, name: src, widget: image }
                  - { label: Didascalia / testo alternativo, name: alt, widget: string }
          - label: Fascia scorrevole
            name: marquee
            widget: object
            fields:
              - { label: Frase 1, name: a, widget: string }
              - { label: Frase 2 (corsivo), name: b, widget: string }
          - label: Contatti
            name: contact
            widget: object
            fields:
              - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
              - { label: Località, name: location, widget: string }
              - { label: Immagine di sfondo, name: background, widget: image }
              - { label: Frase footer, name: footerTagline, widget: string }
      - name: giacca
        label: La giacca
        file: src/content/pages/giacca.json
        fields:
        - label: SEO
          name: seo
          widget: object
          fields:
            - { label: Titolo (max 70), name: title, widget: string }
            - { label: Descrizione (max 170), name: description, widget: text }
        - label: Hero
          name: hero
          widget: object
          fields:
            - { label: Occhiello, name: kicker, widget: string }
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Sottotitolo, name: subtitle, widget: string, required: false }
            - { label: Introduzione, name: intro, widget: text }
            - { label: Frase in corsivo, name: extra, widget: text, required: false }
            - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
        - label: Categorie
          name: categories
          widget: list
          min: 1
          summary: '{{fields.id}}'
          fields:
            - { label: ID ancora, name: id, widget: string }
            - { label: Occhiello, name: kicker, widget: string, required: false }
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Introduzione, name: intro, widget: text, required: false }
            - label: Gruppi
              name: groups
              widget: list
              min: 1
              summary: '{{fields.title}}'
              fields:
                - { label: Titolo del gruppo (facoltativo), name: title, widget: string, required: false }
                - label: Voci
                  name: items
                  widget: list
                  min: 1
                  summary: '{{fields.name}}'
                  fields:
                    - { label: Nome, name: name, widget: string }
                    - { label: Sottotitolo, name: sub, widget: string, required: false }
                    - { label: Testo, name: text, widget: text }
                    - { label: Nota (in corsivo oro), name: note, widget: string, required: false }
                    - { label: Immagine (facoltativa, altrimenti segnaposto), name: image, widget: object, required: false, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
        - label: Rimando alle fodere
          name: linings
          widget: object
          required: false
          fields:
            - { label: Occhiello, name: kicker, widget: string }
            - { label: Titolo, name: title, widget: string }
            - { label: Testo del link, name: cta, widget: string }
            - { label: Destinazione (es. /#fodere), name: href, widget: string }
      - name: pantalone
        label: Il pantalone
        file: src/content/pages/pantalone.json
        fields:
        - label: SEO
          name: seo
          widget: object
          fields:
            - { label: Titolo (max 70), name: title, widget: string }
            - { label: Descrizione (max 170), name: description, widget: text }
        - label: Hero
          name: hero
          widget: object
          fields:
            - { label: Occhiello, name: kicker, widget: string }
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Sottotitolo, name: subtitle, widget: string, required: false }
            - { label: Introduzione, name: intro, widget: text }
            - { label: Frase in corsivo, name: extra, widget: text, required: false }
            - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
        - label: Categorie
          name: categories
          widget: list
          min: 1
          summary: '{{fields.id}}'
          fields:
            - { label: ID ancora, name: id, widget: string }
            - { label: Occhiello, name: kicker, widget: string, required: false }
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Introduzione, name: intro, widget: text, required: false }
            - label: Gruppi
              name: groups
              widget: list
              min: 1
              summary: '{{fields.title}}'
              fields:
                - { label: Titolo del gruppo (facoltativo), name: title, widget: string, required: false }
                - label: Voci
                  name: items
                  widget: list
                  min: 1
                  summary: '{{fields.name}}'
                  fields:
                    - { label: Nome, name: name, widget: string }
                    - { label: Sottotitolo, name: sub, widget: string, required: false }
                    - { label: Testo, name: text, widget: text }
                    - { label: Nota (in corsivo oro), name: note, widget: string, required: false }
                    - { label: Immagine (facoltativa, altrimenti segnaposto), name: image, widget: object, required: false, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
      - name: tessuti
        label: Tessuti
        file: src/content/pages/tessuti.json
        fields:
        - label: SEO
          name: seo
          widget: object
          fields:
            - { label: Titolo (max 70), name: title, widget: string }
            - { label: Descrizione (max 170), name: description, widget: text }
        - label: Hero
          name: hero
          widget: object
          fields:
            - { label: Occhiello, name: kicker, widget: string }
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Introduzione, name: intro, widget: text }
            - { label: Immagine, name: image, widget: object, collapsed: true, fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
        - label: Fibre naturali
          name: fibres
          widget: object
          fields:
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Testo, name: body, widget: text }
            - { label: Galleria (striscia scorrevole), name: gallery, widget: list, min: 1, summary: '{{fields.alt}}', fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
        - label: Re-Nylon
          name: renylon
          widget: object
          fields:
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Paragrafi, name: body, widget: list, min: 1, field: { label: Paragrafo, name: p, widget: text } }
        - label: Partner
          name: partners
          widget: object
          fields:
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - label: Paesi
              name: groups
              widget: list
              min: 1
              summary: '{{fields.title}}'
              fields:
                - { label: Paese (es. Lanifici Italiani), name: title, widget: string }
                - label: Lanifici
                  name: items
                  widget: list
                  min: 1
                  summary: '{{fields.name}}'
                  fields:
                    - { label: Nome, name: name, widget: string }
                    - { label: Anno di fondazione, name: year, widget: number, value_type: int }
            - { label: Nota finale, name: note, widget: text }
        - label: Denim
          name: denim
          widget: object
          fields:
            - { label: Titolo, name: title, widget: list, hint: 'Una riga per voce. *parola* = corsivo.', field: { label: Riga, name: line, widget: string } }
            - { label: Testo, name: body, widget: text }
            - { label: Immagini, name: images, widget: list, min: 1, summary: '{{fields.alt}}', fields: [{ label: Immagine, name: src, widget: image }, { label: Testo alternativo (SEO/accessibilità), name: alt, widget: string }] }
            - { label: Titolo delle caratteristiche, name: featuresTitle, widget: string }
            - label: Caratteristiche
              name: features
              widget: list
              min: 1
              summary: '{{fields.title}}'
              fields:
                - { label: Titolo, name: title, widget: string }
                - { label: Testo, name: body, widget: text }

  - name: impostazioni
    label: Impostazioni
    editor: { preview: false }
    files:
      - name: site
        label: Dati aziendali & contatti
        file: src/content/settings/site.json
        fields:
          - { label: Marchio, name: brand, widget: string }
          - { label: Ragione sociale, name: legalName, widget: string }
          - { label: Payoff, name: tagline, widget: string }
          - { label: Anno di fondazione, name: foundingYear, widget: number, value_type: int }
          - { label: Fondatore, name: founder, widget: string }
          - { label: Telefono (formato +39...), name: phone, widget: string }
          - { label: Telefono (come mostrato), name: phoneDisplay, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Sito web, name: website, widget: string }
          - { label: Instagram (URL), name: instagram, widget: string }
          - { label: Instagram (handle), name: instagramHandle, widget: string }
          - label: Indirizzo
            name: address
            widget: object
            fields:
              - { label: Via e numero, name: street, widget: string, required: false }
              - { label: Comune, name: locality, widget: string }
              - { label: CAP, name: postalCode, widget: string }
              - { label: Provincia (sigla), name: province, widget: string }
              - { label: Regione, name: region, widget: string }
              - { label: Paese (ISO, es. IT), name: country, widget: string }
          - { label: Partita IVA, name: vatNumber, widget: string, required: false }
          - label: Intro animata
            name: intro
            widget: object
            fields:
              - { label: Attiva, name: enabled, widget: boolean }
              - { label: Etichetta, name: label, widget: string }
              - { label: Frase, name: word, widget: string }
