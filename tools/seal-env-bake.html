<!doctype html>
<!--
  Bakes the hero seal's reflection environment into src/scripts/gl/seal.data.ts (ENV_R1, ENV_R08).
  The site doesn't depend on three.js; this page loads it from a CDN, rebuilds the studio the coin used to be lit by
  (five emissive panels → PMREMGenerator), samples the two PMREM levels MeshStandardMaterial blends between for
  roughness 0.8..1 and fits order-4 spherical harmonics to each.
  Run: `npx serve tools` (any static server), open /seal-env-bake.html, paste the two lines into seal.data.ts.
  Edit the studio in envFor() below if the lighting has to change; keep three at the version named in seal.gl.ts.
-->
<html lang="en">
<meta charset="utf-8" />
<title>Seal env bake</title>
<pre id="out">baking…</pre>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer();

function envFor(renderer) {
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
  es.background = new THREE.Color(0x0b0908);
  const add = (w, h, pos, col, k) => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    mesh.position.set(...pos);
    mesh.lookAt(0, 0, 0);
    es.add(mesh);
  };
  add(5, 5, [0, 7, 5], 0xffe0b0, 4.5);
  add(12, 1.6, [-8, 2, 3], 0xfff0da, 1.6);
  add(1.6, 12, [8, -1, 4], 0xc2a36b, 1.2);
  add(10, 10, [0, -7, 5], 0x3b2b1c, 1.2);
  add(20, 20, [0, 0, -9], 0x1a1410, 1);
  const t = pm.fromScene(es, 0.035).texture;
  pm.dispose();
  return t;
}

// Sample textureCubeUV() over an equirectangular grid of world directions.
const env = envFor(renderer);
const H0 = env.image.height, maxMip = Math.log2(H0) - 2;
const W = 256, H = 128;
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType });
const mat = new THREE.ShaderMaterial({
  defines: { ENVMAP_TYPE_CUBE_UV: '', CUBEUV_TEXEL_WIDTH: 1 / (3 * Math.max(2 ** maxMip, 7 * 16)), CUBEUV_TEXEL_HEIGHT: 1 / H0, CUBEUV_MAX_MIP: maxMip + '.0' },
  uniforms: { envMap: { value: env }, rough: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
  fragmentShader: `#include <common>
#include <cube_uv_reflection_fragment>
uniform sampler2D envMap; uniform float rough; varying vec2 vUv;
void main() {
  float th = vUv.y * PI, ph = vUv.x * 2.0 * PI;
  gl_FragColor = vec4(textureCubeUV(envMap, vec3(sin(th) * cos(ph), cos(th), sin(th) * sin(ph)), rough).rgb, 1.0);
}`
});
const scene = new THREE.Scene();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat));
const sample = (rough) => {
  mat.uniforms.rough.value = rough;
  renderer.setRenderTarget(rt);
  renderer.render(scene, new THREE.OrthographicCamera());
  const px = new Float32Array(W * H * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, W, H, px);
  return px;
};

// Real SH basis up to l = 4, same order and constants as env() in seal.gl.ts.
const basis = (x, y, z) => [0.282095,
  0.488603 * y, 0.488603 * z, 0.488603 * x,
  1.092548 * x * y, 1.092548 * y * z, 0.315392 * (3 * z * z - 1), 1.092548 * x * z, 0.546274 * (x * x - y * y),
  0.590044 * y * (3 * x * x - y * y), 2.890611 * x * y * z, 0.457046 * y * (5 * z * z - 1), 0.373176 * z * (5 * z * z - 3),
  0.457046 * x * (5 * z * z - 1), 1.445306 * z * (x * x - y * y), 0.590044 * x * (x * x - 3 * y * y),
  2.503343 * x * y * (x * x - y * y), 1.770131 * y * z * (3 * x * x - y * y), 0.946175 * x * y * (7 * z * z - 1),
  0.669047 * y * z * (7 * z * z - 3), 0.105786 * (35 * z ** 4 - 30 * z * z + 3), 0.669047 * x * z * (7 * z * z - 3),
  0.473087 * (x * x - y * y) * (7 * z * z - 1), 1.770131 * x * z * (x * x - 3 * y * y),
  0.625836 * (x * x * (x * x - 3 * y * y) - y * y * (3 * x * x - y * y))];
const fit = (px) => {
  const c = Array.from({ length: 25 }, () => [0, 0, 0]), dw = (Math.PI / H) * ((2 * Math.PI) / W);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const th = ((j + 0.5) / H) * Math.PI, ph = ((i + 0.5) / W) * 2 * Math.PI, s = Math.sin(th);
    const b = basis(s * Math.cos(ph), Math.cos(th), s * Math.sin(ph)), o = (j * W + i) * 4;
    for (let k = 0; k < 25; k++) for (let ch = 0; ch < 3; ch++) c[k][ch] += px[o + ch] * b[k] * s * dw;
  }
  return c.flat().map((v) => String(+v.toPrecision(5)).replace(/^(-?)0\./, '$1.')).join(',');
};

document.getElementById('out').textContent =
  `export const ENV_R1 = [${fit(sample(1.0))}];\nexport const ENV_R08 = [${fit(sample(0.8))}];\n`;
</script>
</html>
